databases:
  - name: pet-adoption-db
    databaseName: pet_adoption_db
    user: postgres
    plan: free

services:
  # ── Backend (Express API) ─────────────────────────────────────────────────
  - type: web
    name: pet-adoption-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pet-adoption-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: NODE_ENV
        value: production
      - key: UPLOAD_DIR
        value: uploads/

  # ── Frontend (React / Vite static build) ──────────────────────────────────
  - type: web
    name: pet-adoption-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    plan: free
    autoDeploy: true
    routes:
      # Send all paths to index.html so React Router handles client-side routing
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Set this to the backend's Render URL after the backend service is deployed
      # e.g. https://pet-adoption-backend.onrender.com
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_PET_DATA_SOURCE
        value: api
