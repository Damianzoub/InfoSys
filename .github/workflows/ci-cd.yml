name: Pet Adoption CI/CD Pipeline

on:
  push:
    branches: [ "main", "Christos" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v3

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: 📦 Install Backend Dependencies
        working-directory: ./backend
        run: npm install

      - name: 🧪 Run Backend Tests
        working-directory: ./backend
        run: npm test

      - name: 📦 Install Frontend Dependencies & Build
        working-directory: ./frontend
        run: |
          npm install
          npm run build

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    
    steps:
      - name: 🚀 Simulate Deployment
        run: |
          echo "Εκκίνηση Deployment..."
          echo "Τα tests πέρασαν επιτυχώς. Το Build ολοκληρώθηκε."
          echo "Η εφαρμογή 'Pet Adoption' αναπτύχθηκε (Deployed) επιτυχώς στον server!"
