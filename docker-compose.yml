services:
  postgres:
    image: postgres:16
    container_name: pet_adoption_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: pet_adoption_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - pet_adoption_network

  # backend — uncomment in Phase 5 when Dockerfile is ready
  # backend:
  #   build:
  #     context: ./backend
  #     dockerfile: Dockerfile
  #   container_name: pet_adoption_backend
  #   restart: unless-stopped
  #   ports:
  #     - "8000:8000"
  #   environment:
  #     DATABASE_URL: postgresql://postgres:postgres@postgres:5432/pet_adoption_db
  #     JWT_SECRET: change_in_production
  #     PORT: 8000
  #   volumes:
  #     - ./backend/uploads:/app/uploads
  #   depends_on:
  #     - postgres
  #   networks:
  #     - pet_adoption_network

volumes:
  postgres_data:

networks:
  pet_adoption_network:
    driver: bridge
